name: Build firmware

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      product:
        description: FM-1 package identity (FM-1_ followed by digits)
        default: FM-1_9262150

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Use clang as cc and c++
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/bin/cc"
          ln -s "$(command -v clang++)" "$RUNNER_TEMP/bin/c++"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: MIDI output tests
        run: |
          python3 tests/run_midi_seq_out.py
          python3 tests/run_midi_channel_ui.py --reuse-dsp
          python3 tests/run_midi_session_v16.py --reuse-dsp

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: JieLi toolchain
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"
      - name: Build the distribution package
        run: |
          python3 -m pip install --user Pillow
          python3 tools/build.py --pattern-device-candidate --app-opt Oz \
            --product "${{ inputs.product || 'FM-1_9262150' }}" \
            --diagnostics distribution --sdk "$AC79_SDK"
      - uses: actions/upload-artifact@v4
        with:
          name: jamesos-firmware
          path: |
            build/*.fwsc
            build/build-settings.json
          if-no-files-found: error
