name: Build firmware

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/host-tests

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-firmware
        with:
          product: FM-1_9262149
      - uses: actions/upload-artifact@v4
        with:
          name: jamesos-firmware-test
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
