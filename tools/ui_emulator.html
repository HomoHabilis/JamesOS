.keyboard-panel{margin-top:16px;padding:12px 12px 10px;background:#171c1e;border:2px solid #121719;border-radius:22px;box-shadow:inset 0 1px #ffffff0e}.keyboard-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px 9px;color:#aab2b0;font:10px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}.key-state-count{color:#819087;letter-spacing:0}.keyboard{height:126px;position:relative;touch-action:none;user-select:none}.white-row{position:absolute;left:0;right:0;bottom:0;height:94px;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:5px;align-items:stretch}.black-row{position:absolute;z-index:2;top:0;left:0;right:0;height:76px;pointer-events:none}.note-key{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:4px 1px;touch-action:none;user-select:none}.key-cap{border-radius:24px;background:linear-gradient(100deg,#303638,#171c1e 24%,#242a2b 70%,#111617);border:2px solid #0b1011;box-shadow:inset 0 1px #ffffff18,0 2px 3px #0008}.white-row .note-key{width:100%;height:100%;border-radius:25px;padding-top:10px}.white-row .key-cap{background:linear-gradient(100deg,#343a3a,#1e2425 25%,#303635 75%,#161b1c)}.black-key{pointer-events:auto;position:absolute;top:0;height:76px;width:4.85%;min-width:20px;transform:translateX(-50%);border-radius:22px;padding:4px 2px}.note-key .led-bar{display:block;width:4px;height:30px;border-radius:5px;background:#ecebdc;opacity:.13;box-shadow:none;transition:opacity .08s,box-shadow .08s,background .08s}.black-key .led-bar{height:25px}.note-key[data-led-level="1"] .led-bar{opacity:.38;box-shadow:0 0 5px #e8eccb55}.note-key[data-led-level="2"] .led-bar{opacity:.7;background:#f0f3db;box-shadow:0 0 8px #e5f0b080}.note-key[data-led-level="3"] .led-bar{opacity:1;background:#fff8d7;box-shadow:0 0 14px 3px #eff4b9b3}.note-key.is-held .key-cap{background:linear-gradient(100deg,#687858,#34412f 35%,#526248);border-color:#9aae7d}.note-key.is-held /* The instrument is a single scaled panel, not a responsive arrangement. */
.device-viewport{width:100%;max-width:984px;aspect-ratio:984 / 552;margin:auto;position:relative}
.device-scroll{width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:8px}
.device-viewport{max-width:none;margin:0 auto}
.device-viewport>.screen-overlay{position:absolute;display:block;image-rendering:pixelated;background:#000;pointer-events:none;z-index:2}

<body>
<main>
  <header>
    <div><h1>FM-1 · Local UI</h1><p class="hint">A browser model of the physical panel. The connected FM-1 hardware stays untouched.</p></div>
    <button id="reload" type="button">Reload UI changes</button>
  </header>

  <div class="zoom-controls" role="group" aria-label="Device size"><span>Device size</span><button type="button" id="zoom50" aria-pressed="false">50%</button><button type="button" id="zoom100" aria-pressed="true">100%</button><button type="button" id="zoom200" aria-pressed="false">200%</button></div>
  <div class="device-scroll"><div class="device-viewport" id="deviceViewport"><section class="device-shell" aria-label="FM-1 instrument panel">
    <div class="device-top">
      <section class="left-panel" aria-label="Left controls">
        <div class="left-knobs" id="leftKnobs"></div>
        <div class="octave-buttons" id="octaveButtons" aria-label="Octave buttons"></div>
      </section>
      <section class="display-housing" aria-label="Instrument display">
        <div class="display"><img id="screen" alt="FM-1 screen rendered by the local application"></div>
      </section>
      <section class="right-panel" aria-label="Right controls">
        <div class="right-knobs" id="rightKnobs" aria-label="Parameter knobs"></div>
        <div class="button-matrix" id="buttonMatrix" aria-label="Panel buttons"></div>
      </section>
    </div>

    <section class="keyboard-panel" aria-label="FM-1 27-key keyboard">
      <div class="keyboard" id="keyboard">
        <div class="white-row" id="whiteKeys" aria-label="White keys"></div>
        <div class="black-row" id="blackKeys" aria-label="Black keys"></div>
      </div>
    </section>
  </section><img id="screenOverlay" class="screen-overlay" alt="" aria-hidden="true"></div></div>

  <div class="session-row">
    <button type="button" class="latch-control" id="latchMode" aria-pressed="false"><span class="switch-led" aria-hidden="true"></span><span id="latchLabel">Latch mode: off</span></button>
    <button type="button" id="releaseAll">Release all</button>
    <div id="status" class="status">Starting local application…</div>
  </div>
  <p id="error" role="status" aria-live="polite"></p>
</main>

<script>
const $=id=>document.getElementById(id);
const deviceViewport=$('deviceViewport');
let deviceZoom=100;
try{const saved=Number(localStorage.getItem('fm1-device-zoom'));if([50,100,200].includes(saved))deviceZoom=saved}catch(e){}
function scaleDevice(){
  const screenWidth=$('screen').offsetWidth;
  if(!screenWidth)return;
  // Calibrated against the in-app browser screenshot: the 240 CSS-pixel
  // display appeared approximately 216 host points across.
  const targetWidth=(240*deviceZoom/100)/0.9;
  const scale=targetWidth/screenWidth;
  deviceViewport.style.width=(984*scale)+'px';
  deviceViewport.style.height=(552*scale)+'px';
  deviceViewport.firstElementChild.style.transform=`scale(${scale})`;
  const screen=$('screen').getBoundingClientRect(), viewport=deviceViewport.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1, pixel=value=>Math.round(value*dpr)/dpr;
  const overlay=$('screenOverlay');
  overlay.style.left=(pixel(screen.left)-viewport.left)+'px';
  overlay.style.top=(pixel(screen.top)-viewport.top)+'px';
  overlay.style.width=targetWidth+'px';
  overlay.style.height=targetWidth+'px';
  for(const zoom of [50,100,200]){const b=$('zoom'+zoom);b.classList.toggle('active',zoom===deviceZoom);b.setAttribute('aria-pressed',String(zoom===deviceZoom))}
}
for(const zoom of [50,100,200])$('zoom'+zoom).onclick=()=>{deviceZoom=zoom;try{localStorage.setItem('fm1-device-zoom',String(zoom))}catch(e){}scaleDevice()};
window.addEventListener('resize',scaleDevice);scaleDevice();
const whiteKeys=[
  {note:0,name:'F3'},{note:2,name:'G3'},{note:4,name:'A3'},{note:6,name:'B3'},
  {note:7,name:'C4'},{note:9,name:'D4'},{note:11,name:'E4'},{note:12,name:'F4'},
  {note:14,name:'G4'},{note:16,name:'A4'},{note:18,name:'B4'},{note:19,name:'C5'},
  {note:21,name:'D5'},{note:23,name:'E5'},{note:24,name:'F5'},{note:26,name:'G5'}
];
const blackKeys=[
  {note:1,name:'F♯3',legend:'OP1',afterWhite:0},{note:3,name:'G♯3',legend:'OP2',afterWhite:1},
  {note:5,name:'A♯3',legend:'OP3',afterWhite:2},{note:8,name:'C♯4',legend:'OP4',afterWhite:4},
  {note:10,name:'D♯4',legend:'OP5',afterWhite:5},{note:13,name:'F♯4',legend:'OP6',afterWhite:7},
  {note:15,name:'G♯4',legend:'PIT',afterWhite:8},{note:17,name:'A♯4',legend:'GLO',afterWhite:9},
  {note:20,name:'C♯5',legend:'MONO',afterWhite:11},{note:22,name:'D♯5',legend:'POLY',afterWhite:12},
  {note:25,name:'F♯5',legend:'',afterWhite:14}
];
const buttons=[
  {id:2,label:'FX'},{id:3,label:'SEL'},{id:4,label:'ENV'},{id:5,label:'LFO'},{id:6,label:'EDIT'},{id:7,label:'GLO'},
  {id:8,label:'HOME'},{id:9,label:'SAVE'},{id:10,label:'ARP'},{id:11,label:'SEQ'},{id:12,label:'PLAY / STOP'},{id:13,label:'REC'}
];
const encoders=[
  {id:0,label:'SELECT',side:'left'},{id:6,label:'PRESETS',side:'left'},{id:1,label:'ALGORITHM',side:'left'},
  {id:2,label:'KNOB1',side:'right',control:0},{id:3,label:'KNOB2',side:'right',control:1},
  {id:4,label:'KNOB3',side:'right',control:2},{id:5,label:'KNOB4',side:'right',control:3}
];
let state=null,busy=false,queue=[],latchMode=false;
const controls=new Map(),heldControls=new Set(),latchedControls=new Set(),sourcesByControl=new Map(),pointerSources=new Map();
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function send(type,a=0,b=0){queue.push({type,a,b});pump()}
async function pump(){
  if(busy)return;busy=true;
  const event=queue.shift()||{type:'tick'};
  try{
    if(event.type==='reload')$('status').textContent='Rebuilding local UI…';
    const r=await fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)});
    const s=await r.json();if(!r.ok)throw Error(s.error||r.statusText);
    state=s;$('screen').src='data:image/png;base64,'+s.image;$('screenOverlay').src=$('screen').src;
    document.querySelector('.device-shell').classList.toggle('save-screen',!!s.saveScreen);
    if(Array.isArray(s.controls))s.controls.forEach((c,i)=>{const value=$('value'+i);if(value)value.textContent=[c.label,c.text].filter(Boolean).join(' · ')||'—'});
    document.querySelector('[data-button-id="12"]')?.classList.toggle('is-state',!!s.playing);
    document.querySelector('[data-button-id="13"]')?.classList.toggle('is-state',!!s.recording);
    $('status').textContent='Local session · hardware untouched';$('error').textContent='';renderControls();
  }catch(e){$('error').textContent=e.message;$('status').textContent='Local session unavailable'}
  finally{if(event.type==='reload')firmwareReloadQueued=false;busy=false;if(queue.length)pump()}
}

function controlEvent(control,down){send(control.kind==='button'?'button_state':'note',control.id,down?1:0)}
function updateControlState(control,down){
  const had=heldControls.has(control.key);if(had===down)return;
  if(down)heldControls.add(control.key);else heldControls.delete(control.key);
  controlEvent(control,down);renderControls();
}
function addMomentarySource(control,source){
  let sources=sourcesByControl.get(control.key);if(!sources){sources=new Set();sourcesByControl.set(control.key,sources)}
  if(sources.has(source))return;sources.add(source);if(sources.size===1&&!latchedControls.has(control.key))updateControlState(control,true);
}
function removeMomentarySource(source){
  const key=pointerSources.get(source);if(!key)return;pointerSources.delete(source);
  const sources=sourcesByControl.get(key);if(!sources)return;sources.delete(source);
  if(!sources.size){sourcesByControl.delete(key);if(!latchedControls.has(key)){const control=controls.get(key);if(control)updateControlState(control,false)}}
}
function toggleLatched(control){
  if(latchedControls.has(control.key)){latchedControls.delete(control.key);updateControlState(control,false)}
  else{latchedControls.add(control.key);updateControlState(control,true)}
}
function startPhysicalControl(control,source){
  if(latchMode){toggleLatched(control);return}
  pointerSources.set(source,control.key);addMomentarySource(control,source);
}
function stopPhysicalControl(source){removeMomentarySource(source)}
function bindPhysicalControl(el,control){
  controls.set(control.key,control);el.dataset.controlKey=control.key;
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();
    try{el.setPointerCapture(e.pointerId)}catch{}
    startPhysicalControl(control,'p'+e.pointerId);
  });
  const finish=e=>{if(e?.pointerId!==undefined)stopPhysicalControl('p'+e.pointerId)};
  el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);el.addEventListener('lostpointercapture',finish);
  el.addEventListener('keydown',e=>{
    if(e.repeat||!(e.key===' '||e.key==='Enter'))return;e.preventDefault();
    const source='k'+e.key+':'+control.key;el.dataset.keyboardSource=source;startPhysicalControl(control,source);
  });
  el.addEventListener('keyup',e=>{
    if(!(e.key===' '||e.key==='Enter'))return;e.preventDefault();const source=el.dataset.keyboardSource;if(source){stopPhysicalControl(source);delete el.dataset.keyboardSource}
  });
  el.addEventListener('click',e=>{
    // Screen-reader synthesized activation has no preceding pointer or key event.
    if(e.detail===0&&!e.defaultPrevented){if(latchMode)toggleLatched(control);else{updateControlState(control,true);setTimeout(()=>updateControlState(control,false),110)}}
  });
}
function ledIndex(control){return control.kind==='button'?control.id:14+control.id}
function makePhysicalButton({id,label,kind='button',className=''}){
  const b=document.createElement('button');b.type='button';b.className='panel-button '+className;b.setAttribute('aria-label',label);
  b.innerHTML='<span class="switch-led" aria-hidden="true"></span><span class="button-label"></span>';b.querySelector('.button-label').textContent=label;
  const control={kind,id,key:(kind==='button'?'button:':'note:')+id,led:kind==='button'?id:14+id};
  b.dataset.ledIndex=String(control.led);if(kind==='button')b.dataset.buttonId=String(id);bindPhysicalControl(b,control);return b;
}
function makeKnob(entry){
  const wrap=document.createElement('div');wrap.className='knob';
  const label=document.createElement('span');label.className='knob-label';label.textContent=entry.label;wrap.append(label);
  const dial=document.createElement('div');dial.className='dial';dial.setAttribute('role','slider');dial.setAttribute('aria-label',entry.label+' encoder');dial.tabIndex=0;wrap.append(dial);
  if(entry.control!==undefined){label.id='knob-label'+entry.control;const value=document.createElement('span');value.className='knob-note';value.id='value'+entry.control;wrap.append(value)}
  let y=null;
  const turn=delta=>{if(delta)send('encoder',entry.id,clamp(delta,-100,100))};
  dial.addEventListener('wheel',e=>{e.preventDefault();turn(e.deltaY<0?1:-1)},{passive:false});
  dial.addEventListener('pointerdown',e=>{y=e.clientY;try{dial.setPointerCapture(e.pointerId)}catch{};e.preventDefault()});
  dial.addEventListener('pointermove',e=>{if(y===null)return;const d=Math.trunc((y-e.clientY)/5);if(d){y=e.clientY;turn(d)}});
  const end=()=>{y=null};dial.addEventListener('pointerup',end);dial.addEventListener('pointercancel',end);dial.addEventListener('lostpointercapture',end);
  dial.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();turn(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)});
  return wrap;
}

// Four left-side controls: MASTER is an analog volume knob and is not part of the local host API.
const master=document.createElement('div');master.className='knob';master.innerHTML='<span class="knob-label">MASTER</span><div class="dial" role="img" aria-label="Master analog volume unavailable in the local simulator" aria-disabled="true" title="Analog master volume is unavailable in the local simulator"></div><span class="knob-note unavailable">Unavailable locally</span>';$('leftKnobs').append(master);
encoders.filter(e=>e.side==='left').forEach(e=>$('leftKnobs').append(makeKnob(e)));
encoders.filter(e=>e.side==='right').forEach(e=>$('rightKnobs').append(makeKnob(e)));
[{id:0,label:'OCT−'},{id:1,label:'OCT+'}].forEach(x=>$('octaveButtons').append(makePhysicalButton(x)));
buttons.forEach(x=>$('buttonMatrix').append(makePhysicalButton(x)));

whiteKeys.forEach(k=>{
  const b=document.createElement('button');b.type='button';b.className='note-key key-cap white-key';b.setAttribute('aria-label',k.name+' key');b.title=k.name;
  b.innerHTML='<span class="led-bar" aria-hidden="true"></span><span class="key-name"></span>';b.querySelector('.key-name').textContent=k.name;b.dataset.ledIndex=String(14+k.note);
  bindPhysicalControl(b,{kind:'note',id:k.note,key:'note:'+k.note,led:14+k.note});$('whiteKeys').append(b);
});
blackKeys.forEach(k=>{
  const b=document.createElement('button');b.type='button';b.className='note-key key-cap black-key';b.setAttribute('aria-label',k.name+' key'+(k.legend?' · '+k.legend:''));b.title=k.name+(k.legend?' · '+k.legend:'');
  b.style.left=`calc(${(k.afterWhite+1)*100/16}% )`;b.innerHTML='<span class="key-name"></span><span class="led-bar" aria-hidden="true"></span>';b.querySelector('.key-name').textContent=k.legend;b.dataset.ledIndex=String(14+k.note);
  bindPhysicalControl(b,{kind:'note',id:k.note,key:'note:'+k.note,led:14+k.note});$('blackKeys').append(b);
});

function maskHas(mask,index){
  if(mask===undefined||mask===null)return null;
  if(Array.isArray(mask))return !!mask[index];
  const n=Number(mask);if(!Number.isFinite(n))return null;
  return ((n>>>index)&1)!==0;
}
function renderControls(){
  const leds=Array.isArray(state?.ledLevels)?state.ledLevels:null;
  document.querySelectorAll('[data-led-index]').forEach(el=>{
    const i=+el.dataset.ledIndex,level=leds?clamp(Number(leds[i])||0,0,3):0;el.dataset.ledLevel=String(level);
  });
  controls.forEach(control=>{
    const fromMask=control.kind==='button'?maskHas(state?.buttonMask,control.id):maskHas(state?.noteMask,control.id);
    const down=fromMask===null?heldControls.has(control.key):fromMask;
    document.querySelectorAll(`[data-control-key="${control.key}"]`).forEach(el=>{
      el.classList.toggle('is-held',down);el.classList.toggle('is-latched',latchedControls.has(control.key));
    });
  });
  $('latchMode').classList.toggle('active',latchMode);$('latchMode').setAttribute('aria-pressed',String(latchMode));$('latchLabel').textContent='Latch mode: '+(latchMode?'on':'off');
}
function releaseMomentary(){
  for(const [key,sources] of sourcesByControl){const control=controls.get(key);if(control&&!latchedControls.has(key)&&sources.size)updateControlState(control,false)}
  sourcesByControl.clear();pointerSources.clear();
}
function releaseAll(){
  const keys=new Set([...heldControls,...latchedControls]);
  keys.forEach(key=>{const control=controls.get(key);if(control)updateControlState(control,false)});
  latchedControls.clear();sourcesByControl.clear();pointerSources.clear();renderControls();
}
$('latchMode').onclick=()=>{releaseAll();latchMode=!latchMode;renderControls()};
$('releaseAll').onclick=releaseAll;
$('reload').onclick=()=>{releaseAll();send('reload')};
window.addEventListener('blur',releaseMomentary);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
window.addEventListener('pagehide',()=>{
  // A final same-origin release keeps a held note from surviving a browser close/reload.
  for(const key of [...heldControls]){const c=controls.get(key);if(c)navigator.sendBeacon('/event',new Blob([JSON.stringify({type:c.kind==='button'?'button_state':'note',a:c.id,b:0})],{type:'application/json'}))}
});
// Reload the browser when the locally served panel changes. The application
// process and its local session remain running across a page refresh.
let panelRevision=null, checkingPanel=false;
let firmwareCandidate=null, firmwareStable=0, firmwareReloadQueued=false;
async function checkPanelChanges(){
  if(checkingPanel || document.hidden)return;
  checkingPanel=true;
  try{
    const response=await fetch('/',{cache:'no-store'});
    if(!response.ok)return;
    const latest=await response.text();
    if(panelRevision===null)panelRevision=latest;
    else if(latest!==panelRevision)location.reload();
  }catch(e){ /* The existing connection status reports server failures. */ }
  finally{checkingPanel=false}
}
checkPanelChanges();setInterval(checkPanelChanges,1500);
async function checkFirmwareChanges(){
  if(document.hidden || firmwareReloadQueued)return;
  try{
    const response=await fetch('/revision',{cache:'no-store'});
    if(!response.ok)return;
    const version=await response.json();
    if(version.source===version.built){firmwareCandidate=null;firmwareStable=0;return}
    if(firmwareCandidate===version.source)firmwareStable++;
    else {firmwareCandidate=version.source;firmwareStable=1}
    // Don't interrupt playback or a held control while rebuilding.
    if(firmwareStable>=2 && state && !state.playing && !heldControls.size && !busy && !queue.length){
      firmwareReloadQueued=true;
      send('reload');
    }
  }catch(e){ /* Retry once the local server is available again. */ }
}
setInterval(checkFirmwareChanges,2000);
let lastPoll=0;
renderControls();setInterval(()=>{const now=performance.now(),period=state?.messageActive?35:140;if(!document.hidden&&!busy&&!queue.length&&now-lastPoll>=period){lastPoll=now;pump()}},35);pump();
</script>
</body>
</html>
